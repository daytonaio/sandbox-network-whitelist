name: whitelist

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: whitelist-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so an upstream list change cannot fail an unrelated pull request.
  PSL_REF: 80677f92c8d3d4a0fdf1e4960fa35d4dbe2e24a1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/public_suffix_list.dat" "https://raw.githubusercontent.com/publicsuffix/list/${PSL_REF}/public_suffix_list.dat"
      - run: python3 .github/scripts/lint.py whitelist.yaml "$RUNNER_TEMP/public_suffix_list.dat" .github/public-suffix-exceptions.txt
